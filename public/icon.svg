<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Rising Sun Motif -->
  <circle cx="256" cy="180" r="70" fill="url(#sun)" opacity="0.9"/>
  
  <!-- Sprout / Crop Seedling -->
  <path d="M256 390 V 220" stroke="#f0fdf4" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Left Leaf -->
  <path d="M256 310 C 200 310, 150 250, 160 190 C 220 190, 260 250, 256 310 Z" fill="url(#leaf)"/>
  
  <!-- Right Leaf -->
  <path d="M256 260 C 310 260, 360 200, 350 140 C 290 140, 250 200, 256 260 Z" fill="url(#leaf)"/>
  
  <!-- Ground / Furrow lines -->
  <path d="M120 400 C 180 380, 332 380, 392 400" stroke="#86efac" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M160 435 C 210 420, 302 420, 352 435" stroke="#86efac" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.5"/>
</svg>
