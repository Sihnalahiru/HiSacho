    <!-- Safe Service Worker cleanup & Error Trap for iOS Safari/Chrome WebKit -->
    <script>
      (function() {
        // Guard against stale service workers intercepting requests on iOS
        if ('serviceWorker' in navigator) {
          try {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                // If in dev or iframe or broken state, unregister stale workers
                try {
                  var isIframe = false;
                  try { isIframe = window.self !== window.top; } catch(e) { isIframe = true; }
                  if (isIframe || window.location.hostname === 'localhost' || window.location.port === '3000') {
                    regs[i].unregister().catch(function() {});
                  }
                } catch(e) {}
              }
            }).catch(function() {});
          } catch(e) {}
        }

        // Global uncaught error trap to eliminate blank white screen
        window.addEventListener('error', function(event) {
          console.error('[Global Error Trap]:', event.error || event.message);
          var root = document.getElementById('root');
          if (root && (!root.children || root.children.length === 0 || root.querySelector('.initial-loader'))) {
            root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#f8fafc;font-family:sans-serif;padding:24px;text-align:center;">' +
              '<div style="max-width:400px;background:#1e293b;border-radius:24px;padding:24px;box-shadow:0 10px 25px rgba(0,0,0,0.5);border:1px solid #334155;">' +
                '<div style="font-size:36px;margin-bottom:12px;">🌾</div>' +
                '<h2 style="font-size:16px;font-weight:bold;margin:0 0 8px 0;color:#34d399;">SSW ජපන් කෘෂිකර්ම පුහුණුව</h2>' +
                '<p style="font-size:12px;color:#cbd5e1;margin:0 0 16px 0;line-height:1.6;">යෙදුම පූරණය වීමේදී දෝෂයක් හටගැනිණි. කරුණාකර නැවත පූරණය කරන්න.</p>' +
                '<button onclick="window.location.reload()" style="background:#059669;color:#fff;border:none;border-radius:12px;padding:10px 20px;font-size:12px;font-weight:bold;cursor:pointer;">නැවත පූරණය කරන්න (Reload)</button>' +
              '</div></div>';
          }
        });
      })();
    </script>

    <!-- Google Fonts for Sinhala & Japanese -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    </div>
